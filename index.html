<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">  
    <title>Palindrome Checker in JavaScript | CodingNepal</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1>Palindrome Checker</h1>
        <p>A Palindrome Checker verifies if a string or number reads the same forward and backward, ignoring case, spaces, and special characters. It normalizes the input, reverses it, and checks for equality to determine the result.</p>
      </header>
      <div class="inputs">
        <input type="text" spellcheck="false" id="palindrome_value" placeholder="Check palindrome...">
      </div>
      <p class="result"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
